<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>AI Помощник</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #08090d;
  color: #f5f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.container {
  width: min(720px, calc(100% - 24px));
  margin: auto;
  padding-bottom: 40px;
}
header {
  text-align: center;
  padding: 50px 10px 30px;
}
.badge {
  display: inline-block;
  padding: 7px 12px;
  border: 1px solid #292d39;
  border-radius: 999px;
  color: #9da7ff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
}
h1 {
  margin: 20px 0 10px;
  font-size: clamp(38px, 10vw, 58px);
  letter-spacing: -.05em;
}
.subtitle {
  color: #858a9a;
  line-height: 1.6;
}
.app {
  padding: 16px;
  border: 1px solid #242833;
  border-radius: 22px;
  background: #11131a;
}
label {
  display: block;
  margin: 0 0 8px 2px;
  color: #777d90;
  font-size: 12px;
  font-weight: 700;
}
select,
textarea {
  width: 100%;
  border: 1px solid #292d39;
  border-radius: 14px;
  outline: none;
  background: #0b0d12;
  color: white;
}
select {
  height: 52px;
  padding: 0 14px;
  font-size: 15px;
}
textarea {
  margin-top: 14px;
  min-height: 180px;
  padding: 16px;
  resize: vertical;
  font-size: 16px;
  line-height: 1.6;
}
textarea:focus,
select:focus {
  border-color: #6875ff;
}
button {
  width: 100%;
  min-height: 55px;
  margin-top: 13px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg,#6875ff,#886cff);
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
}
.result {
  display: none;
  margin-top: 15px;
  padding: 18px;
  border: 1px solid #292d39;
  border-radius: 14px;
  background: #0b0d12;
}
.result.show {
  display: block;
}
.result-title {
  margin-bottom: 12px;
  color: #9da7ff;
  font-size: 12px;
  font-weight: 800;
}
.result-text {
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.7;
  color: #e5e6eb;
}
.copy {
  min-height: 40px;
  margin-top: 14px;
  background: #171a23;
  border: 1px solid #292d39;
  color: #aeb3c2;
  font-size: 13px;
}
.features {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-top: 10px;
}
.feature {
  padding: 14px 6px;
  border: 1px solid #1e212a;
  border-radius: 14px;
  background: #0e1016;
  text-align: center;
}
.icon {
  font-size: 19px;
}
.feature strong {
  display: block;
  margin-top: 6px;
  font-size: 11px;
}
.feature span {
  display: block;
  margin-top: 3px;
  color: #626879;
  font-size: 9px;
}
footer {
  padding-top: 28px;
  text-align: center;
  color: #4f5462;
  font-size: 11px;
}
@media(max-width:600px) {
  .container {
    width: calc(100% - 18px);
  }
  header {
    padding-top: 35px;
  }
  .app {
    padding: 12px;
  }
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="badge">
    ● AI POWERED
  </div>
  <h1>✦ AI Помощник</h1>
  <p class="subtitle">
    Напиши текст — AI поможет его улучшить,
    перевести или переработать.
  </p>
</header>
<main class="app">
  <label for="action">
    ДЕЙСТВИЕ
  </label>
  <select id="action">
    <option value="improve">
      ✨ Улучшить текст
    </option>
    <option value="polish">
      🇵🇱 Перевести на польский
    </option>
    <option value="english">
      🇬🇧 Перевести на английский
    </option>
    <option value="tiktok">
      🎵 Создать текст для TikTok
    </option>
    <option value="shorten">
      ✂️ Сократить текст
    </option>
  </select>
  <textarea
    id="text"
    placeholder="Напиши здесь свой текст..."
  ></textarea>
  <button
    id="process"
    onclick="processText()"
  >
    ✨ Обработать
  </button>
  <div
    class="result"
    id="resultBox"
  >
    <div class="result-title">
      ✦ РЕЗУЛЬТАТ AI
    </div>
    <div
      class="result-text"
      id="resultText"
    ></div>
    <button
      class="copy"
      onclick="copyResult()"
    >
      📋 Скопировать
    </button>
  </div>
</main>
<section class="features">
  <div class="feature">
    <div class="icon">⚡</div>
    <strong>Быстро</strong>
    <span>За считанные секунды</span>
  </div>
  <div class="feature">
    <div class="icon">🧠</div>
    <strong>Умно</strong>
    <span>Powered by Gemini</span>
  </div>
  <div class="feature">
    <div class="icon">🌍</div>
    <strong>Много языков</strong>
    <span>Перевод и редактура</span>
  </div>
</section>
<footer>
  AI Помощник · Powered by Gemini
</footer>
</div>
<script>
async function processText() {
  const text =
    document.getElementById("text").value.trim();
  const action =
    document.getElementById("action").value;
  const button =
    document.getElementById("process");
  const resultBox =
    document.getElementById("resultBox");
  const resultText =
    document.getElementById("resultText");
  if (!text) {
    resultBox.classList.add("show");
    resultText.textContent =
      "⚠️ Сначала напиши текст.";
    return;
  }
  let instruction = "";
  if (action === "improve") {
    instruction =
      "Улучши этот текст. Исправь ошибки, сделай его грамотным, естественным и понятным. Сохрани смысл. Верни только готовый текст.";
  }
  if (action === "polish") {
    instruction =
      "Переведи этот текст на польский язык. Сделай перевод естественным для носителя польского языка. Сохрани смысл. Верни только перевод.";
  }
  if (action === "english") {
    instruction =
      "Переведи этот текст на английский язык. Сделай перевод естественным для носителя английского языка. Сохрани смысл. Верни только перевод.";
  }
  if (action === "tiktok") {
    instruction =
      "Переделай этот текст в цепляющий текст для TikTok. Сделай сильный первый хук, динамичную подачу и короткие фразы. Не выдумывай факты. Верни готовый текст.";
  }
  if (action === "shorten") {
    instruction =
      "Сократи этот текст. Сохрани главную мысль и важные факты. Удали повторения и лишние слова. Верни только сокращённую версию.";
  }
  button.disabled = true;
  button.textContent =
    "⏳ AI обрабатывает...";
  resultBox.classList.add("show");
  resultText.textContent =
    "AI готовит ответ...";
  try {
    const response =
      await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message:
            instruction +
            "\n\nТекст пользователя:\n" +
            text
        })
      });
    const data =
      await response.json();
    if (!response.ok) {
      throw new Error(
        data.error ||
        "Ошибка сервера"
      );
    }
    if (!data.answer) {
      throw new Error(
        "AI не вернул ответ"
      );
    }
    resultText.textContent =
      data.answer;
  } catch (error) {
    resultText.textContent =
      "❌ Ошибка:\n\n" +
      error.message;
  } finally {
    button.disabled = false;
    button.textContent =
      "✨ Обработать";
  }
}
async function copyResult() {
  const text =
    document
      .getElementById("resultText")
      .textContent;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    const button =
      document.querySelector(".copy");
    button.textContent =
      "✓ Скопировано";
    setTimeout(() => {
      button.textContent =
        "📋 Скопировать";
    }, 1800);
  } catch {
    alert(
      "Не удалось скопировать текст."
    );
  }
}
</script>
</body>
</html>
