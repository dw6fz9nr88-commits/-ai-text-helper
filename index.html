<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08090d"
  >

  <meta
    name="description"
    content="AI Помощник — улучшение, перевод, сокращение и создание текстов"
  >

  <title>AI Помощник</title>

  <!-- DOCX -->
  <script
    src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"
  ></script>

  <!-- PDF -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    type="module"
  ></script>

  <!-- Excel -->
  <script
    src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
  ></script>

  <style>
    :root {
      --bg: #08090d;
      --panel: #11131a;
      --panel2: #171923;
      --border: #292d39;
      --text: #f5f7fb;
      --muted: #8f96a8;
      --accent: #7667ff;
      --accent2: #9d6cff;
      --danger: #ff667d;
      --success: #5ee6a8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(118, 103, 255, 0.12),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    button,
    select,
    textarea,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    header {
      text-align: center;
      padding: 20px 0 28px;
    }

    .language {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }

    .language select {
      width: auto;
      min-width: 120px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(118, 103, 255, 0.35);
      background: rgba(118, 103, 255, 0.09);
      color: #bdb5ff;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 auto;
      max-width: 620px;
      line-height: 1.6;
    }

    .app {
      display: grid;
      gap: 18px;
    }

    .panel {
      background: rgba(17, 19, 26, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.18);
    }

    .field-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    #action {
      margin-bottom: 8px;
    }

    .action-help {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
      margin-bottom: 14px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 230px;
      resize: vertical;
      border: 1px solid var(--border);
      background: #0c0e14;
      color: var(--text);
      border-radius: 16px;
      padding: 16px;
      outline: none;
      line-height: 1.6;
      font-size: 16px;
    }

    textarea:focus,
    select:focus {
      border-color: rgba(118, 103, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(118, 103, 255, 0.08);
    }

    .input-tools {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .tools-left,
    .tools-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn,
    .action-btn {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 11px;
      padding: 9px 12px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .tool-btn:hover,
    .action-btn:hover {
      border-color: rgba(118, 103, 255, 0.6);
      transform: translateY(-1px);
    }

    .tool-btn:disabled,
    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .counter {
      color: var(--muted);
      font-size: 12px;
    }

    #fileInput {
      display: none;
    }

    .file-info {
      display: none;
      margin-top: 10px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      background: rgba(118, 103, 255, 0.06);
      border-radius: 12px;
      white-space: pre-line;
      color: #cfd3df;
      font-size: 13px;
      line-height: 1.5;
    }

    .file-info.show {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .file-info button {
      flex: 0 0 auto;
    }

    .process {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px 18px;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );
      color: white;
      font-weight: 800;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 12px 30px rgba(118, 103, 255, 0.2);
    }

    .process:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .result-title {
      font-weight: 800;
      font-size: 15px;
    }

    .provider {
      color: var(--muted);
      font-size: 12px;
    }

    #resultText {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #0c0e14;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px;
      line-height: 1.65;
      min-height: 100px;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .templates,
    .history {
      display: grid;
      gap: 10px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 15px;
      padding: 14px;
    }

    .card-title {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card-preview {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 11px;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    footer {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 28px 0 8px;
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 18px, 920px);
        padding-top: 10px;
      }

      header {
        padding-top: 8px;
      }

      .language {
        justify-content: center;
      }

      .language select {
        width: 100%;
      }

      .panel {
        padding: 14px;
        border-radius: 17px;
      }

      textarea {
        min-height: 210px;
      }

      .tools-left,
      .tools-right {
        width: 100%;
      }

      .tool-btn {
        flex: 1;
      }

      .file-info.show {
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>

    <div class="language">
      <select id="interfaceLanguage">
        <option value="ru">Русский</option>
        <option value="pl">Polski</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="cs">Čeština</option>
      </select>
    </div>

    <div class="badge" id="badge">
      ● AI POWERED
    </div>

    <h1 id="pageTitle">
      ✦ AI Помощник
    </h1>

    <p class="subtitle" id="pageSubtitle">
      Напиши текст — AI поможет его улучшить, перевести или переработать.
    </p>

  </header>

  <main class="app">

    <section class="panel">

      <label
        class="field-label"
        id="actionLabel"
        for="action"
      >
        ДЕЙСТВИЕ
      </label>

      <select id="action">

        <optgroup
          id="textGroup"
          label="ТЕКСТ"
        >
          <option value="improve">
            Улучшить текст
          </option>

          <option value="polish">
            Сделать текст грамотнее
          </option>

          <option value="english">
            Перевести на английский
          </option>

          <option value="shorten">
            Сократить текст
          </option>

          <option value="summarize">
            Сделать краткое содержание
          </option>

          <option value="explain">
            Объяснить текст
          </option>
        </optgroup>

        <optgroup
          id="createGroup"
          label="СОЗДАНИЕ"
        >
          <option value="write">
            Написать текст
          </option>

          <option value="reply">
            Написать ответ
          </option>

          <option value="business">
            Деловой текст
          </option>

          <option value="tiktok">
            Создать TikTok-текст
          </option>
        </optgroup>

      </select>

      <div
        class="action-help"
        id="actionHelp"
      ></div>

      <textarea
        id="textInput"
        maxlength="10000"
        placeholder="Введите текст..."
      ></textarea>

      <div class="input-tools">

        <div class="tools-left">

          <button
            class="tool-btn"
            id="pasteButton"
            type="button"
          >
            📋 Вставить
          </button>

          <button
            class="tool-btn"
            id="fileButton"
            type="button"
          >
            📎 Добавить файл
          </button>

          <button
            class="tool-btn"
            id="voiceButton"
            type="button"
          >
            🎙️ Голос
          </button>

          <button
            class="tool-btn"
            id="clearButton"
            type="button"
          >
            ✕ Очистить
          </button>

          <input
            type="file"
            id="fileInput"
            accept="*/*"
            multiple
          >

        </div>

        <div
          class="tools-right"
          id="counter"
        >
          0 / 10000
        </div>

      </div>

      <div
        class="file-info"
        id="fileInfo"
      >
        <span id="fileName"></span>

        <button
          class="action-btn"
          id="removeFile"
          type="button"
        >
          ✕
        </button>
      </div>

      <div style="height: 12px;"></div>

      <button
        class="process"
        id="processButton"
        type="button"
      >
        ✨ Обработать
      </button>

    </section>


    <section
      class="panel result"
      id="resultBox"
    >

      <div class="result-head">

        <div
          class="result-title"
          id="resultTitle"
        >
          ✦ РЕЗУЛЬТАТ AI
        </div>

        <div
          class="provider"
          id="provider"
        ></div>

      </div>

      <div id="resultText"></div>

      <div class="result-actions">

        <button
          class="action-btn"
          id="copyButton"
          type="button"
          style="display:none;"
        >
          📋 Скопировать
        </button>

        <button
          class="action-btn"
          id="retryButton"
          type="button"
          style="display:none;"
        >
          ↻ Повторить
        </button>

        <button
          class="action-btn"
          id="speakButton"
          type="button"
          style="display:none;"
        >
          🔊 Озвучить
        </button>

        <button
          class="action-btn"
          id="stopSpeakButton"
          type="button"
          style="display:none;"
        >
          ■ Стоп
        </button>

      </div>

    </section>


    <section class="section">

      <div class="section-title">
        Шаблоны
      </div>

      <div
        class="templates"
        id="templatesList"
      ></div>

      <button
        class="action-btn"
        id="addTemplateButton"
        type="button"
        style="margin-top:10px;"
      >
        ＋ Добавить шаблон
      </button>

    </section>


    <section class="section">

      <div class="section-title">
        История
      </div>

      <div
        style="
          display:flex;
          gap:8px;
          flex-wrap:wrap;
          margin-bottom:10px;
        "
      >

        <button
          class="action-btn"
          id="allHistoryTab"
          type="button"
        >
          Все
        </button>

        <button
          class="action-btn"
          id="favoriteHistoryTab"
          type="button"
        >
          ★ Избранное
        </button>

        <button
          class="action-btn"
          id="clearHistoryButton"
          type="button"
        >
          Очистить историю
        </button>

      </div>

      <div
        class="history"
        id="historyList"
      ></div>

    </section>

  </main>

  <footer id="footer">
    AI Помощник · Gemini · Groq · OpenRouter
  </footer>

</div>

/* =========================================================
   SAFE ID
========================================================= */

function safeId() {

  if (
    typeof crypto !== "undefined" &&
    typeof crypto.randomUUID === "function"
  ) {

    return crypto.randomUUID();

  }

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );
}


/* =========================================================
   HISTORY
========================================================= */

function loadHistory() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data.slice(0, MAX_HISTORY)
      : [];

  } catch {

    return [];

  }
}


function saveHistory(data) {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        data.slice(
          0,
          MAX_HISTORY
        )
      )
    );

  } catch {}

}


function addHistory(
  source,
  result,
  mode,
  providerName
) {

  const history =
    loadHistory();

  history.unshift({

    id:
      safeId(),

    sourceText:
      source.slice(0, MAX_TEXT),

    resultText:
      result.slice(0, MAX_TEXT),

    mode,

    provider:
      providerName || "",

    favorite:
      false,

    createdAt:
      Date.now()

  });

  saveHistory(
    history
  );

  renderHistory();
}


function getModeLabel(mode) {

  return (
    translations[
      getLanguage()
    ]?.[mode] ||
    translations.ru[mode] ||
    mode
  );
}


function renderHistory() {

  const history =
    loadHistory();

  const filtered =
    historyFilter === "favorites"
      ? history.filter(
          item => item.favorite
        )
      : history;

  historyList.innerHTML =
    "";

  if (!filtered.length) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      historyFilter === "favorites"
        ? t("emptyFavorites")
        : t("emptyHistory");

    historyList.appendChild(
      empty
    );

    return;
  }

  filtered.forEach(item => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "card";

    const title =
      document.createElement(
        "div"
      );

    title.className =
      "card-title";

    title.textContent =
      getModeLabel(
        item.mode
      );

    const preview =
      document.createElement(
        "div"
      );

    preview.className =
      "card-preview";

    preview.textContent =
      item.sourceText.slice(
        0,
        180
      );

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "card-actions";

    const use =
      document.createElement(
        "button"
      );

    use.className =
      "action-btn";

    use.type =
      "button";

    use.textContent =
      t("useAgain");

    use.onclick = () => {

      actionSelect.value =
        item.mode;

      textInput.value =
        item.sourceText;

      updateCounter();
      updateActionHelp();
      resetResult();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };

    const favorite =
      document.createElement(
        "button"
      );

    favorite.className =
      "action-btn";

    favorite.type =
      "button";

    favorite.textContent =
      item.favorite
        ? t("favoriteActive")
        : t("favorite");

    favorite.onclick = () => {

      const data =
        loadHistory();

      const target =
        data.find(
          x =>
            x.id === item.id
        );

      if (target) {

        target.favorite =
          !target.favorite;

        saveHistory(
          data
        );

        renderHistory();
      }

    };

    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "action-btn";

    copy.type =
      "button";

    copy.textContent =
      t("copy");

    copy.onclick = () => {

      copyText(
        item.resultText,

    const remove =
      document.createElement(

      );

    remove.className =
      "action-btn";

    remove.type =
      "button";

    remove.textContent =
      t("delete");

    remove.onclick = () => {

      saveHistory(
        loadHistory().filter(
          x =>
            x.id !== item.id

      );

      renderHistory();

    };

    actions.append(
      use,
      favorite,
      copy,
      remove

    card.append(
      title,
      preview,
      actions

    historyList.appendChild(

/* =========================================================
   COPY
========================================================= */

async function copyText(
  text,
  button = copyButton
) {

  if (!text) {
    return;
  }

  try {

    if (
      navigator.clipboard &&
      typeof navigator.clipboard.writeText ===
        "function"
    ) {

      await navigator.clipboard.writeText(
        text
      );

    } else {

      const area =
        document.createElement(
          "textarea"
        );

      area.value =
        text;

      area.style.position =
        "fixed";

      area.style.opacity =
        "0";

      document.body.appendChild(
        area
      );

      area.select();

      document.execCommand(
        "copy"
      );

      area.remove();

    }

    const old =
      button.textContent;

    button.textContent =
      t("copied");

    setTimeout(
      () => {

        button.textContent =
          old;

      },
      1400
    );

  } catch {

    alert(
      t("copiedError")
    );

  }
}

      ) {

        );

      const text =

        );

      textInput.focus();

    } catch {

        t("pasteUnavailable")
      );

    }

  }
);


/* =========================================================
   AI PROCESSING
========================================================= */

async function processText() {

  if (rateLimited) {
    return;
  }

  const message =
    textInput.value.trim();

  const mode =
    actionSelect.value;

  if (!message) {

    showResult(
      t("enterText")
    );

    textInput.focus();

    return;
  }

  if (
    message.length >
    MAX_TEXT
  ) {

    showResult(
      t("tooLong")
    );

    return;
  }

  processButton.disabled =
    true;

  processButton.textContent =
    t("processing");

  retryButton.style.display =
    "none";

  copyButton.style.display =
    "none";

  speakButton.style.display =
    "none";

  stopSpeakButton.style.display =
    "none";

  showResult(
    t("processing")
  );

  provider.textContent =
    "";

  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message,
              mode
            })
        }
      );

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    if (
      response.status ===
      429
    ) {

      const seconds =
        Number(
          data.retryAfter
        ) || 60;

      startRetryTimer(
        seconds
      );

      showResult(
        t("limit") +
        "\n\n" +
        t("retryIn") +
        " " +
        seconds +
        " " +
        t("seconds")
      );

      return;
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        t("serverError")
      );

    }

    if (
      !data.answer ||
      typeof data.answer !==
        "string"
    ) {

      throw new Error(
        t("noAnswer")
      );

    }

    resultText.textContent =
      data.answer;

    resultBox.classList.add(
      "show"
    );

    provider.textContent =
      getProviderName(
        data.provider
      );

    copyButton.style.display =
      "inline-block";

    retryButton.style.display =
      "inline-block";

    if (
      "speechSynthesis" in
      window
    ) {

      speakButton.style.display =
        "inline-block";

      stopSpeakButton.style.display =
        "inline-block";

    }

    addHistory(
      message,
      data.answer,
      mode,
      data.provider
    );

    resultBox.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  } catch (error) {

    showResult(
      error.message ||
      t("serverError")
    );

    retryButton.style.display =
      "inline-block";

  } finally {

    if (!rateLimited) {

      processButton.disabled =
        false;

      processButton.textContent =
        t("process");

    }

  }
}


/* =========================================================
   RATE LIMIT
========================================================= */

function startRetryTimer(
  seconds
) {

  clearInterval(
    retryTimer
  );

  rateLimited =
    true;

  processButton.disabled =
    true;

  let remaining =
    Math.max(
      1,
      Math.floor(
        seconds
      )
    );

  processButton.textContent =
    "⏳ " +
    t("retryIn") +
    " " +
    remaining +
    " " +
    t("seconds");

  retryTimer =
    setInterval(
      () => {

        remaining--;

        if (
          remaining <= 0
        ) {

          clearInterval(
            retryTimer
          );

          retryTimer =
            null;

          rateLimited =
            false;

          processButton.disabled =
            false;

          processButton.textContent =
            t("process");

          return;
        }

        processButton.textContent =
          "⏳ " +
          t("retryIn") +
          " " +
          remaining +
          " " +
          t("seconds");

      },
      1000
    );
}


/* =========================================================
   FILE SYSTEM
========================================================= */

const TEXT_EXTENSIONS =
  new Set([
    "txt",
    "md",
    "csv",
    "json",
    "xml",
    "html",
    "htm",
    "css",
    "js",
    "ts",
    "jsx",
    "tsx",
    "py",
    "java",
    "c",
    "cpp",
    "h",
    "hpp",
    "sql",
    "yaml",
    "yml",
    "ini",
    "conf",
    "log",
    "rtf"
  ]);


const IMAGE_EXTENSIONS =
  new Set([
    "jpg",
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "svg"
  ]);


const AUDIO_EXTENSIONS =
  new Set([
    "mp3",
    "wav",
    "m4a",
    "aac",
    "ogg",
    "flac",
    "opus"
  ]);


const VIDEO_EXTENSIONS =
  new Set([
    "mp4",
    "mov",
    "webm",
    "avi",
    "mkv",
    "mpeg",
    "mpg"
  ]);


const ARCHIVE_EXTENSIONS =
  new Set([
    "zip",
    "rar",
    "7z",
    "tar",
    "gz"
  ]);


const DOCUMENT_EXTENSIONS =
  new Set([
    "doc",
    "docx",
    "pdf",
    "xls",
    "xlsx",
    "ppt",
    "pptx"
  ]);


function getFileExtension(
  file
) {

  const name =
    String(
      file.name || ""
    );

  const parts =
    name.split(".");

  if (
    parts.length <
    2
  ) {
    return "";
  }

  return parts
    .pop()
    .toLowerCase();
}


function formatFileSize(
  bytes
) {

  if (
    !Number.isFinite(
      bytes
    )
  ) {
    return "";
  }

  if (
    bytes <
    1024
  ) {

    return (
      bytes +
      " B"
    );
  }

  if (
    bytes <
    1024 * 1024
  ) {

    return (
      (
        bytes /
        1024
      ).toFixed(1) +
      " KB"
    );
  }

  return (
    (
      bytes /
      (1024 * 1024)
    ).toFixed(1) +
    " MB"
  );
}


function detectFileType(
  file
) {

  const extension =
    getFileExtension(
      file
    );

  const mime =
    String(
      file.type || ""
    ).toLowerCase();

  if (
    TEXT_EXTENSIONS.has(
      extension
    ) ||
    mime.startsWith(
      "text/"
    )
  ) {

    return "text";
  }

  if (
    DOCUMENT_EXTENSIONS.has(
      extension
    )
  ) {

    return "document";
  }

  if (
    IMAGE_EXTENSIONS.has(
      extension
    ) ||
    mime.startsWith(
      "image/"
    )
  ) {

    return "image";
  }

  if (
    AUDIO_EXTENSIONS.has(
      extension
    ) ||
    mime.startsWith(
      "audio/"
    )
  ) {

    return "audio";
  }

  if (
    VIDEO_EXTENSIONS.has(
      extension
    ) ||
    mime.startsWith(
      "video/"
    )
  ) {

    return "video";
  }

  if (
    ARCHIVE_EXTENSIONS.has(
      extension
    )
  ) {

    return "archive";
  }

  return "unknown";
}


function getFileTypeLabel(
  type
) {

  const keys = {

    text: "fileText",
    document: "fileDocument",
    image: "fileImage",
    audio: "fileAudio",
    video: "fileVideo",
    archive: "fileArchive",
    unknown: "fileUnknown"

  };

  return t(
    keys[type] ||
    "fileUnknown"
  );
}


/* =========================================================
   FILE LIST
========================================================= */

function renderSelectedFiles() {

  fileInfo.classList.remove(
    "show"
  );

  fileName.textContent =
    "";

  if (
    !selectedFiles.length
  ) {
    return;
  }

  const lines =
    selectedFiles.map(
      item => {

        return (
          "📎 " +
          item.file.name +
          " · " +
          formatFileSize(
            item.file.size
          ) +
          " · " +
          getFileTypeLabel(
            item.type
          )
        );

      }
    );

  fileName.textContent =
    lines.join(
      "\n"
    );

  fileInfo.classList.add(
    "show"
  );
}


/* =========================================================
   TEXT
========================================================= */

async function extractTextFile(
  file
) {

  const text =
    await file.text();

  return text.slice(
    0,
    MAX_TEXT
  );
}


/* =========================================================
   DOCX
========================================================= */

async function extractDocx(
  file
) {

  if (
    typeof window.mammoth ===
    "undefined"
  ) {

    throw new Error(
      "DOCX_READER_UNAVAILABLE"
    );

  }

  const buffer =
    await file.arrayBuffer();

  const result =
    await window.mammoth.extractRawText({
      arrayBuffer:
        buffer
    });

  return String(
    result.value ||
    ""
  ).slice(
    0,
    MAX_TEXT
  );
}


/* =========================================================
   PDF
========================================================= */

async function getPdfJs() {

  if (
    window.__pdfjs
  ) {
    return window.__pdfjs;
  }

  try {

    const module =
      await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
      );

    window.__pdfjs =
      module;

    if (
      module.GlobalWorkerOptions
    ) {

      module.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    }

    return module;

  } catch {

    throw new Error(
      "PDF_READER_UNAVAILABLE"
    );

  }
}


async function extractPdf(
  file
) {

  const pdfjs =
    await getPdfJs();

  const buffer =
    await file.arrayBuffer();

  const loadingTask =
    pdfjs.getDocument({
      data: buffer
    });

  const pdf =
    await loadingTask.promise;

  let text =
    "";

  const pages =
    Math.min(
      pdf.numPages,
      MAX_PDF_PAGES
    );

  for (
    let pageNumber = 1;
    pageNumber <= pages;
    pageNumber++
  ) {

    const page =
      await pdf.getPage(
        pageNumber
      );

    const content =
      await page.getTextContent();

    const pageText =
      content.items
        .map(
          item =>
            item.str ||
            ""
        )
        .join(" ");

    text +=
      "\n\n===== PAGE " +
      pageNumber +
      " =====\n\n" +
      pageText;

    if (
      text.length >=
      MAX_TEXT
    ) {
      break;
    }

  }

  return text.slice(
    0,
    MAX_TEXT
  );
}


/* =========================================================
   EXCEL
========================================================= */

async function extractSpreadsheet(
  file
) {

  if (
    typeof window.XLSX ===
    "undefined"
  ) {

    throw new Error(
      "XLSX_READER_UNAVAILABLE"
    );

  }

  const buffer =
    await file.arrayBuffer();

  const workbook =
    window.XLSX.read(
      buffer,
      {
        type: "array"
      }
    );

  let output =
    "";

  for (
    const sheetName of
    workbook.SheetNames
  ) {

    const sheet =
      workbook.Sheets[
        sheetName
      ];

    const csv =
      window.XLSX.utils.sheet_to_csv(
        sheet
      );

    output +=
      "\n\n===== " +
      sheetName +
      " =====\n\n" +
      csv;

    if (
      output.length >=
      MAX_TEXT
    ) {
      break;
    }

  }

  return output.slice(
    0,
    MAX_TEXT
  );
}


/* =========================================================
   FILE EXTRACTION
========================================================= */

async function extractFile(
  file,
  type
) {

  if (
    type ===
    "text"
  ) {

    return {
      kind: "text",
      text:
        await extractTextFile(
          file
        )
    };

  }

  if (
    type ===
    "document"
  ) {

    const extension =
      getFileExtension(
        file
      );

    if (
      extension ===
      "docx"
    ) {

      return {
        kind: "text",
        text:
          await extractDocx(
            file
          )
      };

    }

    if (
      extension ===
      "pdf"
    ) {

      return {
        kind: "text",
        text:
          await extractPdf(
            file
          )
      };

    }

    if (
      extension ===
      "xls" ||
      extension ===
      "xlsx"
    ) {

      return {
        kind: "text",
        text:
          await extractSpreadsheet(
            file
          )
      };

    }

    return {
      kind: "unsupported",
      text: ""
    };
  }

  return {
    kind: type,
    text: ""
  };
}


/* =========================================================
   FILE SELECT
========================================================= */

fileButton.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  async () => {

    const files =
      Array.from(
        fileInput.files ||
        []
      );

    if (
      !files.length
    ) {
      return;
    }

    if (
      files.length >
      MAX_FILES
    ) {

      showResult(
        t("maxFiles")
      );

      fileInput.value =
        "";

      return;
    }

    selectedFiles =
      [];

    let extractedText =
      "";

    let unsupportedCount =
      0;

    for (
      const file of
      files
    ) {

      if (
        file.size >
        MAX_FILE_SIZE
      ) {

        showResult(
          t("fileTooLarge") +
          "\n\n" +
          file.name
        );

        continue;
      }

      const type =
        detectFileType(
          file
        );

      selectedFiles.push({
        file,
        type
      });

      try {

        const result =
          await extractFile(
            file,
            type
          );

        if (
          result.kind ===
          "text" &&
          result.text.trim()
        ) {

          extractedText +=
            "\n\n===== " +
            file.name +
            " =====\n\n" +
            result.text;

        } else if (
          result.kind !==
          "text"
        ) {

          unsupportedCount++;

        }

      } catch (error) {

        console.error(
          "File extraction error:",
          error
        );

        unsupportedCount++;

      }

    }

    renderSelectedFiles();

    if (
      extractedText.trim()
    ) {

      textInput.value =
        extractedText.slice(
          0,
          MAX_TEXT
        );

      updateCounter();

      resetResult();

      textInput.focus();

    }

    if (
      unsupportedCount >
      0 &&
      !extractedText.trim()
    ) {

      showResult(
        t("unsupportedFile")
      );

    }

    fileInput.value =
      "";

  }
);


/* =========================================================
   REMOVE FILES
========================================================= */

removeFile.addEventListener(

  () => {

    selectedFiles =
      [];

    fileInput.value =
      "";

    fileInfo.classList.remove(

/* =========================================================
   VOICE
========================================================= */

function getSpeechLanguage(
  language
) {

  const languages = {

    ru: "ru-RU",
    pl: "pl-PL",
    en: "en-US",
    uk: "uk-UA",
    de: "de-DE",
    fr: "fr-FR",
    es: "es-ES",
    it: "it-IT",
    pt: "pt-PT",
    cs: "cs-CZ"

  };

  return (
    languages[language] ||
    "ru-RU"
  );
}


function setupVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (
    !SpeechRecognition
  ) {

    voiceButton.addEventListener(
      "click",
      () => {

        showResult(
          t("microphoneUnavailable")
        );

      }
    );

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.lang =
    getSpeechLanguage(
      getLanguage()
    );

  recognition.onstart =
    () => {

      voiceButton.textContent =
        t("listening");

      voiceButton.disabled =
        true;

    };

  recognition.onresult =
    event => {

      let spokenText =
        "";

      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        spokenText +=
          event.results[i][0]
            .transcript;

      }

      textInput.value =
        spokenText.slice(
          0,
          MAX_TEXT
        );

      updateCounter();

    };

  recognition.onerror =
    () => {

      voiceButton.textContent =
        t("voice");

      voiceButton.disabled =
        false;

    };

  recognition.onend =
    () => {

      voiceButton.textContent =
        t("voice");

      voiceButton.disabled =
        false;

    };

  voiceButton.addEventListener(
    "click",
    () => {

      recognition.lang =
        getSpeechLanguage(
          getLanguage()
        );

      try {

        recognition.start();

      } catch {

        try {
          recognition.stop();
        } catch {}

      }

    }
  );
}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

speakButton.addEventListener(
  "click",
  () => {

    const text =
      resultText.textContent.trim();

    if (
      !text ||
      !(
        "speechSynthesis" in
        window
      )
    ) {
      return;
    }

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang =
      getSpeechLanguage(
        getLanguage()
      );

    utterance.rate =
      0.95;

    window.speechSynthesis.speak(
      utterance
    );

  }
);


stopSpeakButton.addEventListener(
  "click",
  () => {

    if (
      "speechSynthesis" in
      window
    ) {

      window.speechSynthesis.cancel();

    }

  }
);

/* =========================================================
   TEMPLATE
========================================================= */

addTemplateButton.addEventListener(
  "click",
  () => {

    const text =
      textInput.value.trim();

    if (!text) {

      showResult(
        t("enterText")
      );

      return;
    }

    const name =
      prompt(
        t("templateName")
      );

    if (
      !name ||
      !name.trim()
    ) {
      return;
    }

    const templates =
      loadTemplates();

    templates.unshift({

      id:
        safeId(),

      name:
        name
          .trim()
          .slice(
            0,
            100
          ),

      text:
        text.slice(
          0,
          MAX_TEXT
        ),

      mode:
        actionSelect.value

    });

    saveTemplates(
      templates
    );

    renderTemplates();

  }
);


/* =========================================================
   INITIAL LANGUAGE
========================================================= */

let savedLanguage = null;

try {

  savedLanguage =
    localStorage.getItem(
      LANGUAGE_KEY
    );

} catch {}


if (
  savedLanguage &&
  translations[
    savedLanguage
  ]
) {

  interfaceLanguage.value =
    savedLanguage;

} else {

  const browserLanguage =
    (
      navigator.language ||
      "ru"
    ).slice(
      0,
      2
    );

  if (
    translations[
      browserLanguage
    ]
  ) {

    interfaceLanguage.value =
      browserLanguage;

  } else {

    interfaceLanguage.value =
      "ru";

  }

}


/* =========================================================
   INITIAL STATE
========================================================= */

resetResult();

applyLanguage();

setupVoice();

</script>
