<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="AI Помощник — улучшение, перевод, создание и объяснение текста с помощью искусственного интеллекта.">
  <title>AI Помощник</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #08090d;
      --panel: #11131a;
      --panel2: #171a23;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8f96a6;
      --accent: #6d7cff;
      --accent2: #9b5cff;
      --danger: #ff647c;
      --success: #55d99a;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(109,124,255,.16), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    select,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.98);
    }

    .container {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0 50px;
    }

    header {
      text-align: center;
      padding: 8px 0 22px;
    }

    .language {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language select {
      width: auto;
      min-width: 125px;
      padding: 9px 12px;
      border-radius: 12px;
    }

    select,
    textarea {
      width: 100%;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: rgba(109,124,255,.7);
      box-shadow: 0 0 0 3px rgba(109,124,255,.12);
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(109,124,255,.1);
      border: 1px solid rgba(109,124,255,.25);
      color: #aeb7ff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    h1 {
      margin: 15px 0 8px;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 680px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }

    .app {
      background: rgba(17,19,26,.92);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .field-label {
      display: block;
      margin: 0 0 8px;
      color: #b9bfcc;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    #action {
      padding: 14px;
      margin-bottom: 6px;
    }

    .action-help {
      min-height: 20px;
      margin: 0 2px 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    textarea {
      display: block;
      min-height: 220px;
      padding: 16px;
      resize: vertical;
      line-height: 1.55;
      font-size: 16px;
    }

    textarea::placeholder {
      color: #666d7c;
    }

    .input-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
    }

    .tools-left,
    .tools-right {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .tool-btn {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: #dfe3eb;
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 13px;
      white-space: nowrap;
    }

    .tool-btn:hover,
    .action-btn:hover {
      border-color: rgba(109,124,255,.35);
    }

    .counter {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    #fileInput {
      display: none;
    }

    .file-info {
      display: none;
      margin-top: 9px;
      padding: 10px 12px;
      border-radius: 11px;
      background: rgba(109,124,255,.08);
      color: #b9c0ff;
      font-size: 13px;
    }

    .file-info.show {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .process {
      width: 100%;
      margin-top: 16px;
      padding: 15px 18px;
      border: 0;
      border-radius: 15px;
      color: white;
      font-weight: 800;
      font-size: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 28px rgba(109,124,255,.22);
      transition: opacity .2s ease, transform .1s ease;
    }

    .process:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .process:not(:disabled):active {
      transform: scale(.99);
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .result.show {
      display: block;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .result-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #aeb6c7;
    }

    .provider {
      color: #aeb7ff;
      font-size: 12px;
      white-space: nowrap;
    }

    #resultText {
      white-space: pre-wrap;
      line-height: 1.65;
      word-break: break-word;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .action-btn {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: #e6e9f0;
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      margin-bottom: 10px;
      color: #c4c9d4;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .07em;
    }

    .templates,
    .history {
      display: grid;
      gap: 9px;
    }

    .card {
      padding: 13px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 14px;
    }

    .card-title {
      font-weight: 700;
    }

    .card-preview {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    footer {
      text-align: center;
      color: #656c7b;
      font-size: 12px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 18px);
        padding-top: 8px;
      }

      header {
        padding-bottom: 17px;
      }

      .language {
        margin-bottom: 15px;
      }

      .app {
        padding: 12px;
        border-radius: 19px;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 14px;
      }

      textarea {
        min-height: 190px;
      }

      .tools-left {
        width: 100%;
      }

      .tool-btn {
        padding: 9px 10px;
        flex: 1;
      }

      .tools-right {
        display: none;
      }

      .result-actions .action-btn {
        flex: 1 1 auto;
      }
    }

    @media (max-width: 380px) {
      .tool-btn {
        padding: 8px 7px;
        font-size: 12px;
      }

      h1 {
        font-size: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>

<main class="container">

  <header>

    <div class="language">
      <select id="interfaceLanguage" aria-label="Язык интерфейса">
        <option value="ru">🇷🇺 Русский</option>
        <option value="pl">🇵🇱 Polski</option>
        <option value="en">🇬🇧 English</option>
        <option value="uk">🇺🇦 Українська</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="pt">🇵🇹 Português</option>
        <option value="cs">🇨🇿 Čeština</option>

    </div>

    <div class="badge">● AI POWERED</div>

    <h1 id="pageTitle">✦ AI Помощник</h1>

    <p class="subtitle" id="pageSubtitle">
      Напиши, вставь, загрузи или продиктуй текст — AI поможет его улучшить,
      создать, перевести или объяснить.
    </p>

  </header>

  <section class="app">

    <label class="field-label" id="actionLabel" for="action">
      ДЕЙСТВИЕ
    </label>

    <select id="action">

      <optgroup id="textGroup" label="✨ Работа с текстом">
        <option value="improve">✨ Улучшить текст</option>
        <option value="polish">🇵🇱 Перевести на польский</option>
        <option value="english">🇬🇧 Перевести на английский</option>
        <option value="shorten">✂️ Сократить текст</option>
        <option value="summarize">📋 Краткое содержание</option>
        <option value="explain">🧠 Объяснить простыми словами</option>
      </optgroup>

      <optgroup id="createGroup" label="✍️ Создание">
        <option value="write">✍️ Написать текст</option>
        <option value="reply">💬 Ответить на сообщение</option>
        <option value="business">💼 Сделать деловым</option>
        <option value="tiktok">🎵 Создать текст для TikTok</option>
      </optgroup>

    </select>

    <div class="action-help" id="actionHelp"></div>

    <textarea
      id="text"
      maxlength="10000"
      placeholder="Напиши здесь свой текст..."
      autocomplete="off"
      spellcheck="true"
      enterkeyhint="enter"
    ></textarea>

    <div id="fileInfo" class="file-info">
      <span id="fileName"></span>
      <button class="tool-btn" id="removeFile" type="button">✕</button>
    </div>

    <div class="input-tools">

      <div class="tools-left">

        <input
          id="fileInput"
          type="file"
          accept=".txt,.md,.csv,text/plain,text/markdown,text/csv"
        >

        <button class="tool-btn" id="pasteButton" type="button">
          📋 Вставить
        </button>

        <button class="tool-btn" id="fileButton" type="button">
          📎 Файл
        </button>

        <button class="tool-btn" id="voiceButton" type="button">
          🎙 Голос
        </button>

        <button class="tool-btn" id="clearButton" type="button">
          Очистить
        </button>

      </div>

      <div class="tools-right">
        <span class="counter" id="counter">0 / 10 000</span>
      </div>

    </div>

    <button class="process" id="process" type="button">
      ✨ Обработать
    </button>

    <div class="result" id="resultBox">

      <div class="result-head">

        <div class="result-title" id="resultTitle">
          ✦ РЕЗУЛЬТАТ AI
        </div>

        <div class="provider" id="provider"></div>

      </div>

      <div id="resultText"></div>

      <div class="result-actions">

        <button class="action-btn" id="speakButton" type="button">
          🔊 Озвучить
        </button>

        <button class="action-btn" id="stopSpeakButton" type="button">
          ⏹ Стоп
        </button>

        <button class="action-btn" id="copyButton" type="button">
          📋 Скопировать
        </button>

        <button class="action-btn" id="retryButton" type="button">
          🔄 Повторить
        </button>

      </div>

    </div>

  </section>

  <section class="section" id="templatesSection">

    <div class="section-title" id="templatesTitle">
      ШАБЛОНЫ
    </div>

    <div class="templates" id="templatesList"></div>

    <button class="action-btn" id="addTemplateButton" type="button">
      ＋ Добавить шаблон
    </button>

  </section>

  <section class="section" id="historySection">

    <div class="section-title" id="historyTitle">
      ИСТОРИЯ
    </div>

    <div class="card-actions">

      <button class="action-btn" id="allHistoryTab" type="button">
        Все
      </button>

      <button class="action-btn" id="favoriteHistoryTab" type="button">
        ⭐ Избранное
      </button>

      <button class="action-btn" id="clearHistoryButton" type="button">
        Очистить
      </button>

    </div>

    <div class="history" id="historyList"></div>

  </section>

  <footer id="footer">
    AI Помощник · Gemini · Groq · OpenRouter
  </footer>

</main>

/* =========================

========================= */

function getLanguage() {
  return interfaceLanguage.value || "ru";
}

function t(key) {
  const lang = translations[getLanguage()] || translations.ru;

  return lang[key] !== undefined
    ? lang[key]
    : translations.ru[key] || key;
}

function getHelp(mode) {
  const lang = translations[getLanguage()] || translations.ru;

  return (
    lang.help?.[mode] ||
    translations.ru.help?.[mode] ||
    ""
  );
}

function safeId() {
  if (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ) {
    return window.crypto.randomUUID();
  }

  return String(Date.now()) + "-" + Math.random();
}

/* =========================
   HISTORY
========================= */

function loadHistory() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(HISTORY_KEY) || "[]"
      );

    return Array.isArray(data)
      ? data.slice(0, MAX_HISTORY)
      : [];

  } catch {

    return [];

  }
}

function saveHistory(data) {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        data.slice(0, MAX_HISTORY)
      )
    );

  } catch {

    /* Если localStorage переполнен,
       приложение продолжает работать. */

  }
}

function addHistory(
  source,
  result,
  mode,
  providerName
) {

  const history =
    loadHistory();

  history.unshift({

    id: safeId(),

    sourceText:
      source.slice(0, MAX_TEXT),

    resultText:
      result.slice(0, 15000),

    mode,

    provider:
      providerName,

    createdAt:
      Date.now(),

    favorite:
      false

  });

  saveHistory(history);

  renderHistory();
}

function getModeLabel(mode) {

  return t(mode) || mode;
}

function renderHistory() {

  const history =
    loadHistory();

  const filtered =
    historyFilter === "favorites"
      ? history.filter(
          item => item.favorite
        )
      : history;

  historyList.innerHTML = "";

  if (!filtered.length) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      historyFilter === "favorites"
        ? t("emptyFavorites")
        : t("emptyHistory");

    historyList.appendChild(empty);

    return;
  }

  filtered.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "card";

    const title =
      document.createElement("div");

    title.className =
      "card-title";

    title.textContent =
      getModeLabel(item.mode);

    const preview =
      document.createElement("div");

    preview.className =
      "card-preview";

    preview.textContent =
      item.sourceText.slice(0, 180);

    const actions =
      document.createElement("div");

    actions.className =
      "card-actions";

    const use =
      document.createElement("button");

    use.className =
      "action-btn";

    use.type =
      "button";

    use.textContent =
      t("useAgain");

    use.onclick = () => {

      actionSelect.value =
        item.mode;

      textInput.value =
        item.sourceText;

      updateCounter();
      updateActionHelp();
      resetResult();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

    const favorite =
      document.createElement("button");

    favorite.className =
      "action-btn";

    favorite.type =
      "button";

    favorite.textContent =
      item.favorite
        ? t("favoriteActive")
        : t("favorite");

    favorite.onclick = () => {

      const data =
        loadHistory();

      const target =
        data.find(
          x => x.id === item.id
        );

      if (target) {

        target.favorite =
          !target.favorite;

        saveHistory(data);

        renderHistory();
      }
    };

    const copy =
      document.createElement("button");

    copy.className =
      "action-btn";

    copy.type =
      "button";

    copy.textContent =
      t("copy");

    copy.onclick = () =>
      copyText(
        item.resultText,
        copy
      );

    const remove =
      document.createElement("button");

    remove.className =
      "action-btn";

    remove.type =
      "button";

    remove.textContent =
      t("delete");

    remove.onclick = () => {

      saveHistory(
        loadHistory().filter(
          x => x.id !== item.id
        )
      );

      renderHistory();
    };

    actions.append(
      use,
      favorite,
      copy,
      remove
    );

    card.append(
      title,
      preview,
      actions
    );

    historyList.appendChild(card);

  });
}

/* =========================
   COPY
========================= */

async function copyText(
  text,
  button = copyButton
) {

  if (!text) {
    return;
  }

  try {

    if (
      navigator.clipboard &&
      typeof navigator.clipboard.writeText === "function"
    ) {

      await navigator.clipboard.writeText(text);

    } else {

      const area =
        document.createElement("textarea");

      area.value =
        text;

      area.style.position =
        "fixed";

      area.style.opacity =
        "0";

      document.body.appendChild(area);

      area.select();

      document.execCommand("copy");

      area.remove();
    }

    const old =
      button.textContent;

    button.textContent =
      t("copied");

    setTimeout(() => {

      button.textContent =
        old;

    }, 1400);

  } catch {

    alert(t("copiedError"));

  }
}

========================= */

pasteButton.addEventListener(
  "click",
  async () => {

    try {

      if (
        !navigator.clipboard ||
        typeof navigator.clipboard.readText !== "function"
      ) {

        showResult(
          t("pastePermission")
        );

        return;
      }

      const text =
        await navigator.clipboard.readText();

      if (!text) {
        return;
      }

      textInput.value =
        text.slice(0, MAX_TEXT);

      updateCounter();
      resetResult();

      textInput.focus();

    } catch {

      showResult(
        t("pasteUnavailable")
      );

    }

  }
);


/* =========================
   AI PROCESSING
========================= */

async function processText() {

  if (rateLimited) {
    return;
  }

  const message =
    textInput.value.trim();

  const mode =
    actionSelect.value;

  if (!message) {

    showResult(
      t("enterText")
    );

    textInput.focus();

    return;
  }

  if (message.length > MAX_TEXT) {

    showResult(
      t("tooLong")
    );

    return;
  }

  processButton.disabled =
    true;

  processButton.textContent =
    t("processing");

  retryButton.style.display =
    "none";

  copyButton.style.display =
    "none";

  speakButton.style.display =
    "none";

  stopSpeakButton.style.display =
    "none";

  showResult(
    t("processing")
  );

  provider.textContent =
    "";

  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message,
              mode
            })
        }
      );

    const data =
      await response
        .json()
        .catch(() => ({}));

    if (response.status === 429) {

      const seconds =
        Number(data.retryAfter) || 60;

      startRetryTimer(seconds);

      showResult(
        t("limit") +
        "\n\n" +
        t("retryIn") +
        " " +
        seconds +
        " " +
        t("seconds")
      );

      return;
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        t("serverError")
      );
    }

    if (
      !data.answer ||
      typeof data.answer !== "string"
    ) {

      throw new Error(
        t("noAnswer")
      );
    }

    resultText.textContent =
      data.answer;

    resultBox.classList.add(
      "show"
    );

    provider.textContent =
      getProviderName(
        data.provider
      );

    copyButton.style.display =
      "inline-block";

    retryButton.style.display =
      "inline-block";

    if (
      "speechSynthesis" in window
    ) {

      speakButton.style.display =
        "inline-block";

      stopSpeakButton.style.display =
        "inline-block";
    }

    addHistory(
      message,
      data.answer,
      mode,
      data.provider
    );

    resultBox.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  } catch (error) {

    showResult(
      error.message ||
      t("serverError")
    );

    retryButton.style.display =
      "inline-block";

  } finally {

    if (!rateLimited) {

      processButton.disabled =
        false;

      processButton.textContent =
        t("process");
    }

  }
}


/* =========================
   RATE LIMIT TIMER
========================= */

function startRetryTimer(seconds) {

  clearInterval(
    retryTimer
  );

  rateLimited =
    true;

  processButton.disabled =
    true;

  let remaining =
    Math.max(
      1,
      Math.floor(seconds)
    );

  processButton.textContent =
    "⏳ " +
    t("retryIn") +
    " " +
    remaining +
    " " +
    t("seconds");

  retryTimer =
    setInterval(() => {

      remaining--;

      if (remaining <= 0) {

        clearInterval(
          retryTimer
        );

        retryTimer =
          null;

        rateLimited =
          false;

        processButton.disabled =
          false;

        processButton.textContent =
          t("process");

        return;
      }

      processButton.textContent =
        "⏳ " +
        t("retryIn") +
        " " +
        remaining +
        " " +
        t("seconds");

    }, 1000);
}

  async () => {

    const file =
      fileInput.files?.[0];

    if (!file) {
      return;
    }

    if (
      file.size >
      1024 * 1024
    ) {

      showResult(
        t("fileTooLarge")
      );

      fileInput.value =
        "";

      return;
    }

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    if (
      ![
        "txt",
        "md",
        "csv"
      ].includes(extension)
    ) {

      showResult(
        t("unsupportedFile")
      );

      fileInput.value =
        "";

      return;
    }

    try {

      const content =
        await file.text();

      textInput.value =
        content.slice(
          0,
          MAX_TEXT
        );

      updateCounter();

      fileName.textContent =
        "📄 " +
        file.name +
        " · " +
        t("fileLoaded");

      fileInfo.classList.add(
        "show"
      );

      resetResult();

      textInput.focus();

    } catch {

      showResult(
        t("fileReadError")
      );

    }

  }
);

removeFile.addEventListener(
  "click",
  () => {

    fileInput.value =
      "";

    fileInfo.classList.remove(
      "show"
    );

    fileName.textContent =
      "";

  }
);


/* =========================
   VOICE INPUT
========================= */

function getSpeechLanguage(
  language
) {

  const languages = {

    ru: "ru-RU",
    pl: "pl-PL",
    en: "en-US",
    uk: "uk-UA",
    de: "de-DE",
    fr: "fr-FR",
    es: "es-ES",
    it: "it-IT",
    pt: "pt-PT",
    cs: "cs-CZ"

  };

  return (
    languages[language] ||
    "ru-RU"
  );
}

function setupVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    voiceButton.addEventListener(
      "click",
      () => {

        showResult(
          t("microphoneUnavailable")
        );

      }
    );

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.lang =
    getSpeechLanguage(
      getLanguage()
    );

  recognition.onstart =
    () => {

      voiceButton.textContent =
        t("listening");

      voiceButton.disabled =
        true;

    };

  recognition.onresult =
    event => {

      let spokenText =
        "";

      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        spokenText +=
          event.results[i][0].transcript;
      }

      textInput.value =
        spokenText.slice(
          0,
          MAX_TEXT
        );

      updateCounter();

    };

  recognition.onerror =
    () => {

      voiceButton.textContent =
        t("voice");

      voiceButton.disabled =
        false;

    };

  recognition.onend =
    () => {

      voiceButton.textContent =
        t("voice");

      voiceButton.disabled =
        false;

    };

  voiceButton.addEventListener(
    "click",
    () => {

      recognition.lang =
        getSpeechLanguage(
          getLanguage()
        );

      try {

        recognition.start();

      } catch {

        try {
          recognition.stop();
        } catch {}

      }

    }
  );
}


/* =========================
   TEXT TO SPEECH
========================= */

speakButton.addEventListener(
  "click",
  () => {

    const text =
      resultText.textContent.trim();

    if (
      !text ||
      !("speechSynthesis" in window)
    ) {

      return;
    }

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang =
      getSpeechLanguage(
        getLanguage()
      );

    utterance.rate =
      0.95;

    window.speechSynthesis.speak(
      utterance
    );

  }
);

stopSpeakButton.addEventListener(
  "click",
  () => {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();

    }

  }
);


/* =========================
   BUTTONS
========================= */

processButton.addEventListener(
  "click",
  processText
);

retryButton.addEventListener(
  "click",
  processText
);

copyButton.addEventListener(
  "click",
  () => {

    copyText(
      resultText.textContent
    );

  }
);

clearButton.addEventListener(
  "click",
  () => {

    textInput.value =
      "";

    fileInput.value =
      "";

    fileInfo.classList.remove(
      "show"
    );

    fileName.textContent =
      "";

    resetResult();

    updateCounter();

    updateActionHelp();

    textInput.focus();

  }
);

actionSelect.addEventListener(
  "change",
  () => {

    updateActionHelp();

  }
);

textInput.addEventListener(
  "input",
  () => {

    if (
      textInput.value.length >
      MAX_TEXT
    ) {

      textInput.value =
        textInput.value.slice(
          0,
          MAX_TEXT
        );
    }

    updateCounter();

  }
);


/* =========================
   LANGUAGE SWITCH
========================= */

interfaceLanguage.addEventListener(
  "change",
  () => {

    try {

      localStorage.setItem(
        LANGUAGE_KEY,
        interfaceLanguage.value
      );

    } catch {}

    applyLanguage();

  }
);


/* =========================
   HISTORY TABS
========================= */

allHistoryTab.addEventListener(
  "click",
  () => {

    historyFilter =
      "all";

    renderHistory();

  }
);

favoriteHistoryTab.addEventListener(
  "click",
  () => {

    historyFilter =
      "favorites";

    renderHistory();

  }
);

clearHistoryButton.addEventListener(
  "click",
  () => {

    if (
      confirm(
        t("confirmClear")
      )
    ) {

      localStorage.removeItem(
        HISTORY_KEY
      );

      renderHistory();

    }

  }
);


/* =========================
   ADD TEMPLATE
========================= */

addTemplateButton.addEventListener(
  "click",
  () => {

    const text =
      textInput.value.trim();

    if (!text) {

      showResult(
        t("enterText")
      );

      return;
    }

    const name =
      prompt(
        t("templateName")
      );

    if (
      !name ||
      !name.trim()
    ) {

      return;
    }

    const templates =
      loadTemplates();

    templates.unshift({

      id:
        safeId(),

      name:
        name
          .trim()
          .slice(0, 100),

      text:
        text.slice(0, MAX_TEXT),

      mode:
        actionSelect.value

    });

    saveTemplates(
      templates
    );

    renderTemplates();

  }
);


/* =========================
   INITIAL LANGUAGE
========================= */

const savedLanguage =
  localStorage.getItem(
    LANGUAGE_KEY
  );

if (
  savedLanguage &&
  translations[savedLanguage]
) {

  interfaceLanguage.value =
    savedLanguage;

} else {

  const browserLanguage =
    (
      navigator.language ||
      "ru"
    ).slice(0, 2);

  if (
    translations[browserLanguage]
  ) {

    interfaceLanguage.value =
      browserLanguage;

  } else {

    interfaceLanguage.value =
      "ru";
  }
}


/* =========================
   INITIAL STATE
========================= */

resetResult();

applyLanguage();

setupVoice();

</script>

</body>
</html>
