<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Помощник</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #08090d;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 180px;
    box-sizing: border-box;
    padding: 15px;
    border-radius: 12px;
    background: #11131a;
    color: white;
    border: 1px solid #333;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #6875ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

#result {
    margin-top: 20px;
    padding: 18px;
    background: #11131a;
    border: 1px solid #333;
    border-radius: 12px;
    white-space: pre-wrap;
    min-height: 30px;
}
</style>
</head>

<body>

<div class="container">

<h1>✦ AI Помощник</h1>

<textarea
    id="text"
    placeholder="Напиши что-нибудь..."
></textarea>

<button onclick="processText()">
    ✨ Проверить AI
</button>

<div id="result">
    Здесь появится результат...
</div>

</div>

<script>

async function processText() {

    const text = document.getElementById("text").value;
    const result = document.getElementById("result");

    result.innerText = "1️⃣ Кнопка работает...\n";

    if (!text.trim()) {
        result.innerText += "❌ Текст пустой.";
        return;
    }

    result.innerText += "2️⃣ Текст получен.\n";
    result.innerText += "3️⃣ Отправляю запрос на /api/chat...\n";

    try {

        const response = await fetch("/api/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })
        });

        result.innerText +=
            "4️⃣ Сервер ответил. HTTP: " +
            response.status +
            "\n";

        const raw = await response.text();

        result.innerText +=
            "5️⃣ Ответ сервера:\n" +
            raw;

    } catch (error) {

        result.innerText +=
            "\n❌ ОШИБКА JAVASCRIPT:\n" +
            error.message;
    }
}

</script>

</body>
</html>
