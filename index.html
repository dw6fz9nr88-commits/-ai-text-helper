<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="AI Помощник — улучшение, перевод, создание и объяснение текста с помощью искусственного интеллекта.">
  <title>AI Помощник</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #08090d;
      --panel: #11131a;
      --panel2: #171a23;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8f96a6;
      --accent: #6d7cff;
      --accent2: #9b5cff;
      --danger: #ff647c;
      --success: #55d99a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(109,124,255,.16), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    select,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 50px;
    }

    header {
      text-align: center;
      padding: 12px 0 24px;
    }

    .language {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language select {
      width: auto;
      min-width: 120px;
      padding: 9px 12px;
    }

    select,
    textarea {
      width: 100%;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: rgba(109,124,255,.7);
      box-shadow: 0 0 0 3px rgba(109,124,255,.12);
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(109,124,255,.1);
      border: 1px solid rgba(109,124,255,.25);
      color: #aeb7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 650px;
      color: var(--muted);
      line-height: 1.5;
    }

    .app {
      background: rgba(17,19,26,.88);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: #b9bfcc;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    #action {
      padding: 14px;
      margin-bottom: 14px;
    }

    textarea {
      display: block;
      min-height: 220px;
      padding: 16px;
      resize: vertical;
      line-height: 1.55;
      font-size: 16px;
    }

    .input-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
    }

    .tools-left,
    .tools-right {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .tool-btn {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: #dfe3eb;
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 13px;
    }

    .tool-btn:active {
      transform: scale(.97);
    }

    .counter {
      color: var(--muted);
      font-size: 12px;
    }

    #fileInput {
      display: none;
    }

    .file-info {
      display: none;
      margin-top: 9px;
      padding: 10px 12px;
      border-radius: 11px;
      background: rgba(109,124,255,.08);
      color: #b9c0ff;
      font-size: 13px;
    }

    .file-info.show {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .process {
      width: 100%;
      margin-top: 16px;
      padding: 15px 18px;
      border: 0;
      border-radius: 15px;
      color: white;
      font-weight: 800;
      font-size: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 28px rgba(109,124,255,.22);
    }

    .process:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .result.show {
      display: block;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .result-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #aeb6c7;
    }

    .provider {
      color: #aeb7ff;
      font-size: 12px;
    }

    #resultText {
      white-space: pre-wrap;
      line-height: 1.65;
      word-break: break-word;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .action-btn {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: #e6e9f0;
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      margin-bottom: 10px;
      color: #c4c9d4;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .07em;
    }

    .templates,
    .history {
      display: grid;
      gap: 9px;
    }

    .card {
      padding: 13px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 14px;
    }

    .card-title {
      font-weight: 700;
    }

    .card-preview {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    footer {
      text-align: center;
      color: #656c7b;
      font-size: 12px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 18px, 920px);
        padding-top: 10px;
      }

      .app {
        padding: 12px;
        border-radius: 19px;
      }

      textarea {
        min-height: 190px;
      }

      .tool-btn {
        padding: 9px 10px;
      }

      .tools-right {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="language">
        <select id="interfaceLanguage" aria-label="Язык интерфейса">
          <option value="ru">🇷🇺 Русский</option>
          <option value="pl">🇵🇱 Polski</option>
          <option value="en">🇬🇧 English</option>
          <option value="uk">🇺🇦 Українська</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="es">🇪🇸 Español</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="cs">🇨🇿 Čeština</option>
        </select>
      </div>

      <div class="badge">● AI POWERED</div>

      <h1>✦ AI Помощник</h1>

      <p class="subtitle">
        Напиши, вставь, загрузи или продиктуй текст — AI поможет его улучшить,
        создать, перевести или объяснить.
      </p>
    </header>

    <section class="app">

      <label for="action">ДЕЙСТВИЕ</label>

      <select id="action">
        <optgroup label="✨ Работа с текстом">
          <option value="improve">✨ Улучшить текст</option>
          <option value="polish">🇵🇱 Перевести на польский</option>
          <option value="english">🇬🇧 Перевести на английский</option>
          <option value="shorten">✂️ Сократить текст</option>
          <option value="summarize">📋 Краткое содержание</option>
          <option value="explain">🧠 Объяснить простыми словами</option>
        </optgroup>

        <optgroup label="✍️ Создание">
          <option value="write">✍️ Написать текст</option>
          <option value="reply">💬 Ответить на сообщение</option>
          <option value="business">💼 Сделать деловым</option>
          <option value="tiktok">🎵 Создать текст для TikTok</option>
        </optgroup>
      </select>

      <textarea
        id="text"
        maxlength="10000"
        placeholder="Напиши здесь свой текст..."
        autocomplete="off"
        spellcheck="true"
      ></textarea>

      <div id="fileInfo" class="file-info">
        <span id="fileName"></span>
        <button class="tool-btn" id="removeFile" type="button">✕</button>
      </div>

      <div class="input-tools">
        <div class="tools-left">
          <input
            id="fileInput"
            type="file"
            accept=".txt,.md,.csv,text/plain,text/markdown,text/csv"
          >

          <button class="tool-btn" id="fileButton" type="button">
            📎 Файл
          </button>

          <button class="tool-btn" id="voiceButton" type="button">
            🎙 Голос
          </button>

          <button class="tool-btn" id="clearButton" type="button">
            Очистить
          </button>
        </div>

        <div class="tools-right">
          <span class="counter" id="counter">0 / 10 000</span>
        </div>
      </div>

      <button class="process" id="process" type="button">
        ✨ Обработать
      </button>

      <div class="result" id="resultBox">
        <div class="result-head">
          <div class="result-title">✦ РЕЗУЛЬТАТ AI</div>
          <div class="provider" id="provider"></div>
        </div>

        <div id="resultText"></div>

        <div class="result-actions">
          <button class="action-btn" id="speakButton" type="button">
            🔊 Озвучить
          </button>

          <button class="action-btn" id="stopSpeakButton" type="button">
            ⏹ Стоп
          </button>

          <button class="action-btn" id="copyButton" type="button">
            📋 Скопировать
          </button>

          <button class="action-btn" id="retryButton" type="button">
            🔄 Повторить
          </button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">ШАБЛОНЫ</div>

      <div class="templates" id="templatesList"></div>

      <button class="action-btn" id="addTemplateButton" type="button">
        ＋ Добавить шаблон
      </button>
    </section>

    <section class="section">
      <div class="section-title">ИСТОРИЯ</div>

      <div class="card-actions">
        <button class="action-btn" id="allHistoryTab" type="button">
          Все
        </button>

        <button class="action-btn" id="favoriteHistoryTab" type="button">
          ⭐ Избранное
        </button>

        <button class="action-btn" id="clearHistoryButton" type="button">
          Очистить
        </button>
      </div>

      <div class="history" id="historyList"></div>
    </section>

    <footer>
      AI Помощник · Gemini · Groq · OpenRouter
    </footer>

  </main>

<script>
"use strict";

const textInput = document.getElementById("text");
const counter = document.getElementById("counter");
const processButton = document.getElementById("process");
const resultBox = document.getElementById("resultBox");
const resultText = document.getElementById("resultText");
const provider = document.getElementById("provider");
const retryButton = document.getElementById("retryButton");
const copyButton = document.getElementById("copyButton");
const speakButton = document.getElementById("speakButton");
const stopSpeakButton = document.getElementById("stopSpeakButton");
const actionSelect = document.getElementById("action");
const interfaceLanguage = document.getElementById("interfaceLanguage");

const fileInput = document.getElementById("fileInput");
const fileButton = document.getElementById("fileButton");
const removeFile = document.getElementById("removeFile");
const fileInfo = document.getElementById("fileInfo");
const fileName = document.getElementById("fileName");
const voiceButton = document.getElementById("voiceButton");
const clearButton = document.getElementById("clearButton");

const historyList = document.getElementById("historyList");
const clearHistoryButton = document.getElementById("clearHistoryButton");
const allHistoryTab = document.getElementById("allHistoryTab");
const favoriteHistoryTab = document.getElementById("favoriteHistoryTab");
const templatesList = document.getElementById("templatesList");
const addTemplateButton = document.getElementById("addTemplateButton");

const HISTORY_KEY = "ai_helper_history_v2";
const TEMPLATES_KEY = "ai_helper_templates_v2";
const LANGUAGE_KEY = "ai_helper_interface_language_v2";

const MAX_HISTORY = 20;
const MAX_TEMPLATES = 30;
const MAX_TEXT = 10000;

let historyFilter = "all";
let rateLimited = false;
let retryTimer = null;
let recognition = null;

const translations = {
  ru: {
    subtitle: "Напиши, вставь, загрузи или продиктуй текст — AI поможет его улучшить, создать, перевести или объяснить.",
    action: "Действие",
    improve: "✨ Улучшить текст",
    polish: "🇵🇱 Перевести на польский",
    english: "🇬🇧 Перевести на английский",
    shorten: "✂️ Сократить текст",
    summarize: "📋 Краткое содержание",
    explain: "🧠 Объяснить простыми словами",
    write: "✍️ Написать текст",
    reply: "💬 Ответить на сообщение",
    business: "💼 Сделать деловым",
    tiktok: "🎵 Создать текст для TikTok",
    process: "✨ Обработать",
    processing: "⏳ AI работает...",
    copy: "📋 Скопировать",
    copied: "✓ Скопировано",
    retry: "🔄 Повторить",
    speak: "🔊 Озвучить",
    stop: "⏹ Стоп",
    file: "📎 Файл",
    voice: "🎙 Голос",
    clear: "Очистить",
    templates: "ШАБЛОНЫ",
    history: "ИСТОРИЯ",
    all: "Все",
    favorites: "⭐ Избранное",
    clearHistory: "Очистить",
    addTemplate: "＋ Добавить шаблон",
    emptyHistory: "История пока пуста.",
    emptyFavorites: "Избранных записей пока нет.",
    emptyTemplates: "Шаблонов пока нет.",
    useAgain: "Использовать",
    favorite: "☆",
    favoriteActive: "★",
    delete: "Удалить",
    enterText: "Введите текст.",
    tooLong: "Текст слишком длинный. Максимум 10 000 символов.",
    serverError: "Произошла ошибка сервера.",
    noAnswer: "AI не вернул ответ.",
    limit: "⚠️ Лимит AI временно исчерпан.",
    retryIn: "Попробуйте снова через",
    seconds: "сек.",
    fileLoaded: "Файл загружен",
    unsupportedFile: "Поддерживаются только TXT, MD и CSV.",
    fileTooLarge: "Файл слишком большой. Максимум 1 МБ.",
    microphoneUnavailable: "Голосовой ввод не поддерживается этим браузером.",
    listening: "🔴 Слушаю...",
    explainPlaceholder: "Вставь сложный текст, термин или описание — AI объяснит это простыми словами.",
    placeholder: "Напиши здесь свой текст..."
  },

  en: {
    subtitle: "Write, paste, upload or dictate text — AI can improve, create, translate or explain it.",
    action: "Action",
    improve: "✨ Improve text",
    polish: "🇵🇱 Translate to Polish",
    english: "🇬🇧 Translate to English",
    shorten: "✂️ Shorten text",
    summarize: "📋 Summarize",
    explain: "🧠 Explain simply",
    write: "✍️ Write text",
    reply: "💬 Reply to message",
    business: "💼 Make professional",
    tiktok: "🎵 Create TikTok text",
    process: "✨ Process",
    processing: "⏳ AI is working...",
    copy: "📋 Copy",
    copied: "✓ Copied",
    retry: "🔄 Retry",
    speak: "🔊 Read aloud",
    stop: "⏹ Stop",
    file: "📎 File",
    voice: "🎙 Voice",
    clear: "Clear",
    templates: "TEMPLATES",
    history: "HISTORY",
    all: "All",
    favorites: "⭐ Favorites",
    clearHistory: "Clear",
    addTemplate: "＋ Add template",
    emptyHistory: "History is empty.",
    emptyFavorites: "No favorites yet.",
    emptyTemplates: "No templates yet.",
    useAgain: "Use",
    favorite: "☆",
    favoriteActive: "★",
    delete: "Delete",
    enterText: "Enter some text.",
    tooLong: "Text is too long. Maximum 10,000 characters.",
    serverError: "Server error.",
    noAnswer: "AI returned no answer.",
    limit: "⚠️ AI limit reached.",
    retryIn: "Try again in",
    seconds: "sec.",
    fileLoaded: "File loaded",
    unsupportedFile: "Only TXT, MD and CSV files are supported.",
    fileTooLarge: "File is too large. Maximum 1 MB.",
    microphoneUnavailable: "Voice input is not supported by this browser.",
    listening: "🔴 Listening...",
    explainPlaceholder: "Paste a difficult text, term or description — AI will explain it simply.",
    placeholder: "Write your text here..."
  }
};

function t(key) {
  const lang = translations[interfaceLanguage.value] || translations.ru;
  return lang[key] || translations.ru[key] || key;
}

function getLanguage() {
  return interfaceLanguage.value || "ru";
}

function applyLanguage() {
  document.documentElement.lang = getLanguage();

  document.querySelector('label[for="action"]').textContent = t("action");

  document.querySelector("#action option[value='improve']").textContent = t("improve");
  document.querySelector("#action option[value='polish']").textContent = t("polish");
  document.querySelector("#action option[value='english']").textContent = t("english");
  document.querySelector("#action option[value='shorten']").textContent = t("shorten");
  document.querySelector("#action option[value='summarize']").textContent = t("summarize");
  document.querySelector("#action option[value='explain']").textContent = t("explain");
  document.querySelector("#action option[value='write']").textContent = t("write");
  document.querySelector("#action option[value='reply']").textContent = t("reply");
  document.querySelector("#action option[value='business']").textContent = t("business");
  document.querySelector("#action option[value='tiktok']").textContent = t("tiktok");

  processButton.textContent = rateLimited ? processButton.textContent : t("process");
  copyButton.textContent = t("copy");
  retryButton.textContent = t("retry");
  speakButton.textContent = t("speak");
  stopSpeakButton.textContent = t("stop");
  fileButton.textContent = t("file");
  voiceButton.textContent = t("voice");
  clearButton.textContent = t("clear");

  document.querySelector(".section:nth-of-type(1) .section-title").textContent = t("templates");
  document.querySelector(".section:nth-of-type(2) .section-title").textContent = t("history");

  addTemplateButton.textContent = t("addTemplate");
  allHistoryTab.textContent = t("all");
  favoriteHistoryTab.textContent = t("favorites");
  clearHistoryButton.textContent = t("clearHistory");

  updatePlaceholder();
  updateCounter();
  renderHistory();
  renderTemplates();
}

function updatePlaceholder() {
  if (actionSelect.value === "explain") {
    textInput.placeholder = t("explainPlaceholder");
  } else {
    textInput.placeholder = t("placeholder");
  }
}

function updateCounter() {
  counter.textContent =
    textInput.value.length.toLocaleString(getLanguage()) +
    " / 10 000";
}

function showResult(message) {
  resultBox.classList.add("show");
  resultText.textContent = message;
}

function resetResult() {
  resultBox.classList.remove("show");
  resultText.textContent = "";
  provider.textContent = "";
}

function getProviderName(name) {
  if (name === "gemini") return "✦ Gemini";
  if (name === "groq") return "⚡ Groq";
  if (name === "openrouter") return "◈ OpenRouter";
  return "✦ AI";
}

function loadHistory() {
  try {
    const data = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    return Array.isArray(data) ? data.slice(0, MAX_HISTORY) : [];
  } catch {
    return [];
  }
}

function saveHistory(data) {
  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(data.slice(0, MAX_HISTORY))
  );
}

function addHistory(source, result, mode, providerName) {
  const history = loadHistory();

  history.unshift({
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now() + Math.random()),
    sourceText: source.slice(0, MAX_TEXT),
    resultText: result.slice(0, 15000),
    mode,
    provider: providerName,
    createdAt: Date.now(),
    favorite: false
  });

  saveHistory(history);
  renderHistory();
}

function getModeLabel(mode) {
  const map = {
    improve: "improve",
    polish: "polish",
    english: "english",
    shorten: "shorten",
    summarize: "summarize",
    explain: "explain",
    write: "write",
    reply: "reply",
    business: "business",
    tiktok: "tiktok"
  };

  return t(map[mode] || "improve");
}

function renderHistory() {
  const history = loadHistory();

  const filtered = historyFilter === "favorites"
    ? history.filter(item => item.favorite)
    : history;

  historyList.innerHTML = "";

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent =
      historyFilter === "favorites"
        ? t("emptyFavorites")
        : t("emptyHistory");

    historyList.appendChild(empty);
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = getModeLabel(item.mode);

    const preview = document.createElement("div");
    preview.className = "card-preview";
    preview.textContent = item.sourceText.slice(0, 180);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const use = document.createElement("button");
    use.className = "action-btn";
    use.textContent = t("useAgain");
    use.onclick = () => {
      actionSelect.value = item.mode;
      textInput.value = item.sourceText;
      updateCounter();
      updatePlaceholder();
      resetResult();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    const favorite = document.createElement("button");
    favorite.className = "action-btn";
    favorite.textContent = item.favorite
      ? t("favoriteActive")
      : t("favorite");

    favorite.onclick = () => {
      const data = loadHistory();
      const target = data.find(x => x.id === item.id);

      if (target) {
        target.favorite = !target.favorite;
        saveHistory(data);
        renderHistory();
      }
    };

    const copy = document.createElement("button");
    copy.className = "action-btn";
    copy.textContent = t("copy");

    copy.onclick = () => copyText(item.resultText, copy);

    const remove = document.createElement("button");
    remove.className = "action-btn";
    remove.textContent = t("delete");

    remove.onclick = () => {
      saveHistory(loadHistory().filter(x => x.id !== item.id));
      renderHistory();
    };

    actions.append(use, favorite, copy, remove);
    card.append(title, preview, actions);
    historyList.appendChild(card);
  });
}

function loadTemplates() {
  try {
    const data = JSON.parse(localStorage.getItem(TEMPLATES_KEY) || "[]");
    return Array.isArray(data) ? data.slice(0, MAX_TEMPLATES) : [];
  } catch {
    return [];
  }
}

function saveTemplates(data) {
  localStorage.setItem(
    TEMPLATES_KEY,
    JSON.stringify(data.slice(0, MAX_TEMPLATES))
  );
}

function renderTemplates() {
  const templates = loadTemplates();

  templatesList.innerHTML = "";

  if (!templates.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = t("emptyTemplates");
    templatesList.appendChild(empty);
    return;
  }

  templates.forEach(template => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = template.name;

    const preview = document.createElement("div");
    preview.className = "card-preview";
    preview.textContent = template.text.slice(0, 160);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const use = document.createElement("button");
    use.className = "action-btn";
    use.textContent = t("useAgain");

    use.onclick = () => {
      actionSelect.value = template.mode;
      textInput.value = template.text;
      updateCounter();
      updatePlaceholder();
      resetResult();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    const remove = document.createElement("button");
    remove.className = "action-btn";
    remove.textContent = t("delete");

    remove.onclick = () => {
      saveTemplates(
        loadTemplates().filter(x => x.id !== template.id)
      );
      renderTemplates();
    };

    actions.append(use, remove);
    card.append(title, preview, actions);
    templatesList.appendChild(card);
  });
}

async function copyText(text, button = copyButton) {
  try {
    await navigator.clipboard.writeText(text);

    const old = button.textContent;
    button.textContent = t("copied");

    setTimeout(() => {
      button.textContent = old;
    }, 1400);
  } catch {
    alert("Не удалось скопировать текст.");
  }
}

async function processText() {
  if (rateLimited) return;

  const message = textInput.value.trim();
  const mode = actionSelect.value;

  if (!message) {
    showResult(t("enterText"));
    return;
  }

  if (message.length > MAX_TEXT) {
    showResult(t("tooLong"));
    return;
  }

  processButton.disabled = true;
  processButton.textContent = t("processing");

  retryButton.style.display = "none";
  copyButton.style.display = "none";
  speakButton.style.display = "none";
  stopSpeakButton.style.display = "none";

  showResult(t("processing"));
  provider.textContent = "";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        mode
      })
    });

    const data = await response.json().catch(() => ({}));

    if (response.status === 429) {
      const seconds = Number(data.retryAfter) || 60;

      startRetryTimer(seconds);
      showResult(
        t("limit") +
        "\n\n" +
        t("retryIn") +
        " " +
        seconds +
        " " +
        t("seconds")
      );

      return;
    }

    if (!response.ok) {
      throw new Error(data.error || t("serverError"));
    }

    if (!data.answer || typeof data.answer !== "string") {
      throw new Error(t("noAnswer"));
    }

    resultText.textContent = data.answer;
    resultBox.classList.add("show");

    provider.textContent = getProviderName(data.provider);

    copyButton.style.display = "inline-block";
    speakButton.style.display = "inline-block";
    retryButton.style.display = "inline-block";

    addHistory(
      message,
      data.answer,
      mode,
      data.provider
    );

  } catch (error) {
    showResult(error.message || t("serverError"));
    retryButton.style.display = "inline-block";
  } finally {
    if (!rateLimited) {
      processButton.disabled = false;
      processButton.textContent = t("process");
    }
  }
}

function startRetryTimer(seconds) {
  clearInterval(retryTimer);

  rateLimited = true;
  processButton.disabled = true;

  let remaining = Math.max(1, Math.floor(seconds));

  processButton.textContent =
    "⏳ " + t("retryIn") + " " + remaining + " " + t("seconds");

  retryTimer = setInterval(() => {
    remaining--;

    if (remaining <= 0) {
      clearInterval(retryTimer);
      retryTimer = null;
      rateLimited = false;
      processButton.disabled = false;
      processButton.textContent = t("process");
      return;
    }

    processButton.textContent =
      "⏳ " + t("retryIn") + " " + remaining + " " + t("seconds");
  }, 1000);
}

/* ФАЙЛ */

fileButton.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async () => {
  const file = fileInput.files?.[0];

  if (!file) return;

  if (file.size > 1024 * 1024) {
    showResult(t("fileTooLarge"));
    fileInput.value = "";
    return;
  }

  const extension = file.name
    .split(".")
    .pop()
    .toLowerCase();

  if (!["txt", "md", "csv"].includes(extension)) {
    showResult(t("unsupportedFile"));
    fileInput.value = "";
    return;
  }

  try {
    const content = await file.text();

    textInput.value = content.slice(0, MAX_TEXT);

    updateCounter();

    fileName.textContent =
      "📄 " + file.name + " · " + t("fileLoaded");

    fileInfo.classList.add("show");

    resetResult();

  } catch {
    showResult("Не удалось прочитать файл.");
  }
});

removeFile.addEventListener("click", () => {
  fileInput.value = "";
  fileInfo.classList.remove("show");
  fileName.textContent = "";
});

/* ГОЛОС */

function setupVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    voiceButton.addEventListener("click", () => {
      showResult(t("microphoneUnavailable"));
    });

    return;
  }

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = getLanguage();

  recognition.onstart = () => {
    voiceButton.textContent = t("listening");
  };

  recognition.onresult = event => {
    let text = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      text += event.results[i][0].transcript;
    }

    textInput.value = text.slice(0, MAX_TEXT);
    updateCounter();
  };

  recognition.onerror = () => {
    voiceButton.textContent = t("voice");
  };

  recognition.onend = () => {
    voiceButton.textContent = t("voice");
  };

  voiceButton.addEventListener("click", () => {
    recognition.lang = getLanguage();

    try {
      recognition.start();
    } catch {
      try {
        recognition.stop();
      } catch {}
    }
  });
}

setupVoice();

/* ОЗВУЧИВАНИЕ */

speakButton.addEventListener("click", () => {
  const text = resultText.textContent.trim();

  if (!text || !("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  const languages = {
    ru: "ru-RU",
    pl: "pl-PL",
    en: "en-US",
    uk: "uk-UA",
    de: "de-DE",
    fr: "fr-FR",
    es: "es-ES",
    it: "it-IT",
    pt: "pt-PT",
    cs: "cs-CZ"
  };

  utterance.lang = languages[getLanguage()] || "ru-RU";
  utterance.rate = 0.95;

  window.speechSynthesis.speak(utterance);
});

stopSpeakButton.addEventListener("click", () => {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
});

/* КНОПКИ */

processButton.addEventListener("click", processText);

retryButton.addEventListener("click", processText);

copyButton.addEventListener("click", () => {
  copyText(resultText.textContent);
});

clearButton.addEventListener("click", () => {
  textInput.value = "";
  fileInput.value = "";
  fileInfo.classList.remove("show");
  resetResult();
  updateCounter();
});

actionSelect.addEventListener("change", () => {
  updatePlaceholder();
});

textInput.addEventListener("input", () => {
  updateCounter();

  if (textInput.value.length > MAX_TEXT) {
    textInput.value = textInput.value.slice(0, MAX_TEXT);
  }
});

interfaceLanguage.addEventListener("change", () => {
  localStorage.setItem(
    LANGUAGE_KEY,
    interfaceLanguage.value
  );

  if (recognition) {
    recognition.lang = getLanguage();
  }

  applyLanguage();
});

allHistoryTab.addEventListener("click", () => {
  historyFilter = "all";
  renderHistory();
});

favoriteHistoryTab.addEventListener("click", () => {
  historyFilter = "favorites";
  renderHistory();
});

clearHistoryButton.addEventListener("click", () => {
  if (confirm("Удалить всю историю?")) {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  }
});

addTemplateButton.addEventListener("click", () => {
  const text = textInput.value.trim();

  if (!text) {
    showResult(t("enterText"));
    return;
  }

  const name = prompt("Название шаблона:");

  if (!name || !name.trim()) return;

  const templates = loadTemplates();

  templates.unshift({
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()),
    name: name.trim().slice(0, 100),
    text: text.slice(0, MAX_TEXT),
    mode: actionSelect.value
  });

  saveTemplates(templates);
  renderTemplates();
});

/* ЯЗЫК ПО УМОЛЧАНИЮ */

const savedLanguage =
  localStorage.getItem(LANGUAGE_KEY);

if (savedLanguage && translations[savedLanguage]) {
  interfaceLanguage.value = savedLanguage;
} else {
  const browserLanguage =
    (navigator.language || "ru").slice(0, 2);

  if (translations[browserLanguage]) {
    interfaceLanguage.value = browserLanguage;
  } else {
    interfaceLanguage.value = "ru";
  }
}

applyLanguage();
</script>

</body>
